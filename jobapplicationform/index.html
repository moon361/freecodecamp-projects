<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Job Application Form</title>
</head>
<body>
    <div class="container">
        <h1>Job Application Form</h1>
        <form action="#">
            <label for="name">Full Name:</label>
            <input type="text" id="email" placeholder="Enter your name" />

            <label for="email">Email:</label>
            <input type="email" id="email" placeholder="Enter your email" />

            <label for="position">Position:</label>
            <select name="position" id="position">
                <option value="">Select a position</option>
                <option value="developer">Developer</option>
                <option value="designer">Designer</option>
                <option value="manager">Manager</option>
            </select>

            <fieldset class="radio-group">
                <legend>Availability</legend>
                <label for="full-time">
                    <input type="radio" name="availability" id="full-time" />Full-Time
                </label>

                <label for="part-time">
                    <input type="radio" name="availability" id="part-time" />Part-Time
                </label>
            </fieldset>

            <label for="message">Why do you want this job?</label>
            <textarea id="message" placeholder="Write your motivation"></textarea>

            <button type="submit">Submit Application</button>
        </form>
    </div>
</body>
</html>
