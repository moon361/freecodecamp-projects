<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Registration Form</title>
</head>
<body>
    <h1>Registration Form</h1>
    <p>Please fill out this form with the required information.</p>
    <form action="POST">
        <fieldset>
            <label for="first-name">Enter Your First Name:
                <input type="text" name="first-name" id="first-name">
            </label>
            <label for="last-name">Enter Your Last Name:
                <input type="text" name="last-name" id="last-name">
            </label>
            <label for="email">Enter Your Email:
                <input type="email" name="email" id="email">
            </label>
            <label for="new-password">Create a New Password:
                <input type="password" name="new-password" id="new-password">
            </label>
        </fieldset>
        <fieldset>
            <legend>Account Type (required)</legend>
            <label for="personal">
                <input class="inline" type="radio" name="account-type" id="personal" checked>Personal
            </label>
            <label for="business">
                <input class="inline" type="radio" name="account-type" id="business">Business
            </label>
        </fieldset>
        <fieldset>
            <label for="profile-picture">Upload a Profile Picture:
                <input type="file" name="profile-picture" id="profile-picture">
            </label>
            <label for="age">Input Your Age (Years):
                <input type="number" name="age" id="age">
            </label>
            <label for="referrer">How did you hear about us?
                <select name="referrer" id="referrer">
                    <option value="">(select one)</option>
                    <option value="1">freeCodeCamp News</option>
                    <option value="2">freeCodeCamp YouTube Channel</option>
                    <option value="3">freeCodeCamp Forum</option>
                    <option value="4">Other</option>
                </select>
                <label for="bio">Provide a bio:
                    <textarea name="bio" id="bio" rows="3" cols="30" placeholder="I like coding at the beach..."></textarea>
                </label>
            </label>
        </fieldset>
        <a href="#">Read our Terms & Conditions</a>
        <label for="terms-and-conditions">
            <input class="inline" type="checkbox" name="terms-and-conditions" id="terms-and-conditions">I accept the Terms & Conditions.
        </label>
        <label for="submit">
            <input type="submit" name="submit" id="submit" value="Submit">
        </label>
    </form>
</body>
</html>
