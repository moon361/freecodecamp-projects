<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css" />
    <title>Feature Selection Page</title>
</head>
<body>
    <h1>Selection Panel</h1>
    <div class="feature-card-container">
        <label for="cloud-storage" class="feature-card">
            <input type="checkbox" name="cloud-storage" id="cloud-storage" />
            <span>Cloud Storage</span>
            100 Gygabyte Secure Storage
        </label>

        <label for="dedicated-support" class="feature-card">
            <input type="checkbox" name="dedicated-support" id="dedicated-support" />
            <span>Dedicated Support</span>
            24/7 Customer Help
        </label>

        <label for="advanced-analytics" class="feature-card">
            <input type="checkbox" name="advanced-analytics" id="advanced-analytics" />
            <span>Advanced Analytics</span>
            Insights & reports
        </label>

        <label for="custom-user-themes" class="feature-card">
            <input type="checkbox" name="custom-user-themes" id="custom-user-themes" />
            <span>Custom User Themes</span>
            Personalized dashboard design
        </label>

        <label for="multi-user-collab" class="feature-card">
            <input type="checkbox" name="multi-user-collab" id="multi-user-collab" />
            <span>Multi-User Collab</span>
            Team access and sharing
        </label>

        <label for="api-access" class="feature-card">
            <input type="checkbox" name="api-access" id="api-access" />
            <span>API Access</span>
            Integrate with your custom built tools
        </label>
    </div>
</body>
</html>
